api_platform:
    title: API Sport-Manager
    version: 1.0.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    formats:
        json:
            mime_types: ['application/json']

    docs_formats:
        jsonopenapi:
            mime_types: ['application/vnd.openapi+json']
        html:
            mime_types: ['text/html']

    error_formats:
        jsonproblem:
            mime_types: ['application/problem+json']
